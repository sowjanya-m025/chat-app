<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#334fc4">
  <title>Chat App | Real-time Messaging</title>
  <style>
    :root {
      color-scheme: light;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #1b2435;
      background: #f3f5fb;
    }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; padding: 24px; display: grid; place-items: center; }
    .app {
      width: min(820px, 100%); height: min(800px, 92vh); min-height: 500px;
      display: flex; flex-direction: column; background: #fff; border: 1px solid #e4e8f0;
      border-radius: 20px; overflow: hidden; box-shadow: 0 24px 70px rgba(25, 39, 80, .10);
    }
    header { padding: 22px 24px; background: linear-gradient(135deg, #334fc4, #6576e8); color: white; }
    .header-row { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
    h1 { margin: 0; font-size: 1.35rem; letter-spacing: -.02em; }
    header p { margin: 6px 0 0; opacity: .88; font-size: .92rem; }
    .status { display: inline-flex; align-items: center; gap: 7px; font-size: .78rem; white-space: nowrap; }
    .dot { width: 8px; height: 8px; background: #f5c95d; border-radius: 50%; }
    .dot.online { background: #76e4ae; }
    .identity { padding: 14px 18px; display: flex; align-items: center; gap: 12px; border-bottom: 1px solid #edf0f6; }
    label { font-size: .84rem; color: #67738a; white-space: nowrap; }
    input, button { font: inherit; }
    input { min-width: 0; padding: 12px 13px; border: 1px solid #dce2ed; border-radius: 11px; outline: none; }
    input:focus { border-color: #5268d8; box-shadow: 0 0 0 3px #5268d81a; }
    #username { width: 190px; }
    .hint { margin-left: auto; font-size: .78rem; color: #7a8599; text-align: right; }
    #messages { flex: 1; min-height: 0; overflow-y: auto; list-style: none; padding: 20px; margin: 0; display: flex; flex-direction: column; gap: 14px; scroll-behavior: smooth; }
    #messages li { max-width: min(82%, 560px); padding: 11px 14px; border-radius: 4px 15px 15px 15px; background: #f0f3fa; overflow-wrap: anywhere; }
    #messages li .meta { display: block; color: #65718a; font-size: .74rem; margin-bottom: 5px; }
    #messages li .body { white-space: pre-wrap; line-height: 1.45; }
    #messages li.system { max-width: 100%; padding: 0; background: transparent; color: #8490a4; font-size: .82rem; text-align: center; }
    .composer { display: flex; gap: 10px; padding: 15px 18px; border-top: 1px solid #edf0f6; background: #fff; }
    #message { flex: 1; }
    button { border: 0; border-radius: 11px; background: #4058cb; color: white; font-weight: 650; padding: 0 21px; cursor: pointer; transition: background .15s, transform .15s; }
    button:hover { background: #2f46b4; }
    button:active { transform: scale(.98); }
    button:disabled { opacity: .55; cursor: not-allowed; }
    .notice { min-height: 20px; padding: 0 18px 8px; color: #b54747; font-size: .82rem; }
    footer { padding: 0 18px 13px; color: #9aa3b3; font-size: .72rem; text-align: center; }
    @media (max-width: 560px) {
      body { padding: 0; }
      .app { width: 100%; height: 100vh; min-height: 100vh; border-radius: 0; }
      header { padding: 18px; }
      .identity { flex-wrap: wrap; padding: 12px; }
      #username { flex: 1; width: auto; }
      .hint { width: 100%; margin-left: 0; text-align: left; }
      #messages { padding: 14px; }
      #messages li { max-width: 94%; }
      .composer { padding: 12px; }
      button { padding: 0 16px; }
    }
  </style>
</head>
<body>
  <main class="app">
    <header>
      <div class="header-row">
        <h1>💬 Chat App</h1>
        <span class="status"><span id="statusDot" class="dot"></span><span id="statusText">Connecting…</span></span>
      </div>
      <p>A simple place to talk in real time.</p>
    </header>

    <section class="identity" aria-label="Your chat profile">
      <label for="username">Display name</label>
      <input id="username" maxlength="30" autocomplete="nickname" value="Guest" placeholder="Enter your name">
      <span class="hint">Messages are visible to everyone in this chat.</span>
    </section>

    <ul id="messages" aria-live="polite" aria-label="Chat messages">
      <li class="system">Connecting to chat…</li>
    </ul>
    <div id="notice" class="notice" role="status"></div>

    <form id="form" class="composer">
      <input id="message" maxlength="1000" autocomplete="off" placeholder="Write a message…" aria-label="Write a message" required>
      <button id="send" type="submit">Send</button>
    </form>
    <footer>Real-time messaging powered by Socket.IO</footer>
  </main>

  <script src="/socket.io/socket.io.js"></script>
  <script>
    const socket = io();
    const form = document.getElementById("form");
    const usernameInput = document.getElementById("username");
    const messageInput = document.getElementById("message");
    const messages = document.getElementById("messages");
    const notice = document.getElementById("notice");
    const statusText = document.getElementById("statusText");
    const statusDot = document.getElementById("statusDot");
    const sendButton = document.getElementById("send");

    function setStatus(connected) {
      statusText.textContent = connected ? "Connected" : "Reconnecting…";
      statusDot.classList.toggle("online", connected);
      sendButton.disabled = !connected;
    }

    function showSystemMessage(text) {
      const item = document.createElement("li");
      item.className = "system";
      item.textContent = text;
      messages.appendChild(item);
      messages.scrollTop = messages.scrollHeight;
    }

    function addMessage(message) {
      const item = document.createElement("li");
      const meta = document.createElement("span");
      meta.className = "meta";
      const timestamp = new Date(message.createdAt || Date.now());
      const time = timestamp.toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
      meta.textContent = `${message.username || "Guest"} · ${time}`;

      const body = document.createElement("span");
      body.className = "body";
      body.textContent = message.text || "";

      item.append(meta, body);
      messages.appendChild(item);
      while (messages.children.length > 100) messages.removeChild(messages.firstChild);
      messages.scrollTop = messages.scrollHeight;
    }

    socket.on("connect", () => {
      setStatus(true);
      notice.textContent = "";
    });
    socket.on("disconnect", () => setStatus(false));
    socket.on("connect_error", () => {
      setStatus(false);
      notice.textContent = "Unable to connect. Retrying automatically…";
    });
    socket.on("chat history", history => {
      messages.replaceChildren();
      if (!history.length) showSystemMessage("No messages yet. Say hello!");
      else history.forEach(addMessage);
    });
    socket.on("chat message", message => {
      if (messages.querySelector(".system") && messages.children.length === 1) {
        messages.replaceChildren();
      }
      addMessage(message);
    });
    socket.on("chat error", message => {
      notice.textContent = message;
    });

    form.addEventListener("submit", event => {
      event.preventDefault();
      const text = messageInput.value.trim();
      if (!text || !socket.connected) return;
      socket.emit("chat message", {
        username: usernameInput.value.trim() || "Guest",
        text
      });
      messageInput.value = "";
      notice.textContent = "";
      messageInput.focus();
    });
  </script>
</body>
</html>
